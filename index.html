<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>慢集市 · 在线商城</title><style>:root{--p:#e6e2cf;--s:#f4f1e6;--i:#3d4241;--m:#637d83;--l:#c4c8bd;--r:#9a554d;font-family:"Microsoft YaHei",sans-serif;color:var(--i)}*{box-sizing:border-box}body{margin:0;background:var(--p)}button,input,select{font:inherit}button{cursor:pointer}header,main{max-width:1160px;margin:auto;padding-inline:24px}header{height:80px;display:flex;align-items:center;gap:28px;border-bottom:1px solid var(--l)}.brand{color:var(--m);font-size:22px;font-weight:700}.search{display:flex;gap:7px;flex:1;max-width:400px;border-bottom:1px solid var(--l);padding:7px}.search input{border:0;background:transparent;outline:0;flex:1}.nav{margin-left:auto;display:flex;gap:16px}.nav button,.tag{border:0;background:transparent;color:var(--i)}.primary{border:0;background:var(--m);color:var(--s);padding:10px 15px}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;padding:58px 0 34px}.hero h1{font-size:54px;line-height:1.05;color:var(--m);margin:0}.hero p{color:#67706e;line-height:1.8}.hero img{width:100%;height:255px;object-fit:cover;filter:saturate(.55)}.section-head{display:flex;align-items:center;justify-content:space-between;margin:20px 0}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.product{background:var(--s);padding:12px}.product img{width:100%;aspect-ratio:1;object-fit:cover;filter:saturate(.55)}.product h3{font-size:16px;margin:10px 0 6px}.price{color:var(--r);font-weight:700}.product button{float:right;border:1px solid var(--m);background:transparent;padding:5px 8px}.view{display:none}.view.show{display:block}.panel{max-width:780px;margin:38px auto;background:var(--s);padding:24px}.cart-row,.addr{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--l)}.cart-row img{width:64px;height:64px;object-fit:cover}.cart-row div{flex:1}.qty{width:55px;padding:5px}.remove{border:0;color:var(--r);background:transparent}.total{display:flex;justify-content:space-between;margin:20px 0;font-size:19px}.form{display:grid;gap:10px}.form input{padding:10px;border:1px solid var(--l);background:#fffdf6}.order{padding:15px 0;border-bottom:1px solid var(--l)}.order small{color:#69716f}.empty{text-align:center;color:#69716f;padding:44px}@media(max-width:750px){.hero{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:38px}.nav{gap:8px}header{gap:12px}}</style><body><header><span class="brand">慢集市</span><div class="search"><input id="q" placeholder="搜索商品" oninput="render()">⌕</div><div class="nav"><button onclick="page('home')">首页</button><button onclick="page('cart')">购物车 <b id="badge">0</b></button><button onclick="page('orders')">我的订单</button></div></header><main><section id="home" class="view show"><div class="hero"><div><h1>慢慢挑，<br>安心买。</h1><p>一个为课程项目准备的轻量在线商城。商品、购物车、地址和订单，全部可以在这里完成。</p><button class="primary" onclick="document.getElementById('goods').scrollIntoView()">查看商品</button></div><img src="https://picsum.photos/id/433/900/560" alt="桌上静物"></div><div class="section-head"><h2 id="goods">商品精选</h2><select id="cat" onchange="render()"><option value="">全部分类</option><option>家居</option><option>文具</option><option>生活</option></select></div><div id="products" class="products"></div></section><section id="cart" class="view"><div class="panel"><h2>购物车</h2><div id="cartlist"></div><div class="total"><span>合计</span><b id="sum">¥0</b></div><button class="primary" onclick="checkout()">去结算</button></div></section><section id="orders" class="view"><div class="panel"><h2>收货地址</h2><div id="addresses"></div><form class="form" onsubmit="addAddress(event)"><input id="name" placeholder="收货人" required><input id="phone" placeholder="手机号" required><input id="detail" placeholder="详细地址" required><button class="primary">新增地址</button></form><h2>我的订单</h2><div id="orderlist"></div></div></section></main><script>const goods=[['白瓷咖啡杯','家居',49,'https://picsum.photos/id/1060/500/500'],['山雾香氛蜡烛','生活',68,'https://picsum.photos/id/225/500/500'],['蓝灰手账本','文具',32,'https://picsum.photos/id/24/500/500'],['原木书签','文具',18,'https://picsum.photos/id/175/500/500'],['晨光布袋','生活',39,'https://picsum.photos/id/1074/500/500'],['小枝花瓶','家居',58,'https://picsum.photos/id/292/500/500'],['阅读台灯','家居',129,'https://picsum.photos/id/250/500/500'],['棉麻餐垫','生活',26,'https://picsum.photos/id/1080/500/500']].map((x,i)=>({id:i+1,name:x[0],category:x[1],price:x[2],image:x[3],stock:20}));let cart=JSON.parse(localStorage.mallCart||'[]'),addresses=JSON.parse(localStorage.mallAddr||'[]'),orders=JSON.parse(localStorage.mallOrders||'[]');const save=()=>{localStorage.mallCart=JSON.stringify(cart);localStorage.mallAddr=JSON.stringify(addresses);localStorage.mallOrders=JSON.stringify(orders)};function page(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('show'));document.getElementById(id).classList.add('show');render()}function render(){let k=q.value.toLowerCase(),c=cat.value;products.innerHTML=goods.filter(x=>(!c||x.category===c)&&x.name.toLowerCase().includes(k)).map(x=>`<article class="product"><img src="${x.image}"><h3>${x.name}</h3><small>${x.category} · 库存 ${x.stock}</small><p class="price">¥${x.price}<button onclick="add(${x.id})">加入</button></p></article>`).join('');badge.textContent=cart.reduce((a,x)=>a+x.qty,0);cartlist.innerHTML=cart.length?cart.map(x=>{let g=goods.find(a=>a.id===x.id);return `<div class="cart-row"><img src="${g.image}"><div><b>${g.name}</b><br>¥${g.price} · 库存 ${g.stock}</div><input class="qty" type="number" min="1" max="${g.stock}" value="${x.qty}" onchange="qty(${x.id},this.value)"><button class="remove" onclick="del(${x.id})">删除</button></div>`}).join(''):'<p class="empty">购物车还是空的。</p>';sum.textContent='¥'+cart.reduce((a,x)=>a+goods.find(g=>g.id===x.id).price*x.qty,0);addresses.innerHTML=addresses.map((a,i)=>`<div class="addr"><input type="radio" name="addr" ${a.default?'checked':''} onchange="def(${i})"><div>${a.name} ${a.phone}<br><small>${a.detail}</small></div><button class="remove" onclick="rmaddr(${i})">删除</button></div>`).join('')||'<p class="empty">请先添加一个收货地址。</p>';orderlist.innerHTML=orders.map((o,i)=>`<article class="order"><b>${o.no}</b> · ${o.status}<br><small>${o.items.map(x=>x.name+' × '+x.qty).join('，')}</small><p>¥${o.total} ${o.status==='待支付'?`<button class="remove" onclick="cancel(${i})">取消订单</button>`:''}</p></article>`).join('')||'<p class="empty">还没有订单。</p>'}function add(id){let x=cart.find(x=>x.id===id);if(x)x.qty++;else cart.push({id,qty:1});save();render()}function qty(id,n){let g=goods.find(x=>x.id===id),x=cart.find(x=>x.id===id);x.qty=Math.max(1,Math.min(+n,g.stock));save();render()}function del(id){cart=cart.filter(x=>x.id!==id);save();render()}function addAddress(e){e.preventDefault();addresses.push({name:name.value,phone:phone.value,detail:detail.value,default:!addresses.length});save();e.target.reset();render()}function def(i){addresses.forEach((a,j)=>a.default=i===j);save();render()}function rmaddr(i){addresses.splice(i,1);if(addresses[0])addresses[0].default=true;save();render()}function checkout(){let a=addresses.find(x=>x.default);if(!cart.length)return alert('购物车为空');if(!a)return page('orders');for(let x of cart){let g=goods.find(y=>y.id===x.id);if(x.qty>g.stock)return alert(g.name+' 库存不足');g.stock-=x.qty}orders.unshift({no:'ORD'+Date.now(),status:'待支付',items:cart.map(x=>({...goods.find(g=>g.id===x.id),qty:x.qty})),total:cart.reduce((s,x)=>s+goods.find(g=>g.id===x.id).price*x.qty,0)});cart=[];save();page('orders')}function cancel(i){let o=orders[i];o.items.forEach(x=>goods.find(g=>g.id===x.id).stock+=x.qty);o.status='已取消';save();render()}render()</script></body></html>
