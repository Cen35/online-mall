<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>慢集市 · 在线商城</title>
<style>:root{--paper:#e6e2cf;--card:#f8f5e9;--ink:#3d4241;--blue:#637d83;--line:#c4c8bd;--red:#9a554d;font-family:"Microsoft YaHei",sans-serif;color:var(--ink)}*{box-sizing:border-box}body{margin:0;background:var(--paper)}button,input,select{font:inherit}button{cursor:pointer}header,main{max-width:1160px;margin:auto;padding-inline:24px}header{height:80px;display:flex;align-items:center;gap:28px;border-bottom:1px solid var(--line)}.brand{color:var(--blue);font-size:22px;font-weight:700}.search{display:flex;gap:7px;flex:1;max-width:400px;border-bottom:1px solid var(--line);padding:7px}.search input{border:0;background:transparent;outline:0;flex:1}.nav{margin-left:auto;display:flex;gap:16px}.nav button{border:0;background:transparent;color:var(--ink)}.primary{border:0;background:var(--blue);color:#fff;padding:10px 15px}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;padding:58px 0 34px}.hero h1{font-size:54px;line-height:1.05;color:var(--blue);margin:0}.hero p{color:#67706e;line-height:1.8}.hero img{width:100%;height:255px;object-fit:cover;filter:saturate(.55)}.section-head{display:flex;align-items:center;justify-content:space-between;margin:20px 0}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.product{background:var(--card);padding:12px}.product img{width:100%;aspect-ratio:1;object-fit:cover;filter:saturate(.55)}.product h3{font-size:16px;margin:10px 0 6px}.price{color:var(--red);font-weight:700}.product button{float:right;border:1px solid var(--blue);background:transparent;padding:5px 8px}.view{display:none}.view.show{display:block}.panel{max-width:780px;margin:38px auto;background:var(--card);padding:24px}.cart-row,.addr{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}.cart-row img{width:64px;height:64px;object-fit:cover}.cart-row div{flex:1}.qty{width:55px;padding:5px}.remove{border:0;color:var(--red);background:transparent}.total{display:flex;justify-content:space-between;margin:20px 0;font-size:19px}.form{display:grid;gap:10px}.form input{padding:10px;border:1px solid var(--line);background:#fffdf6}.order{padding:15px 0;border-bottom:1px solid var(--line)}.order small{color:#69716f}.empty{text-align:center;color:#69716f;padding:44px}.notice{max-width:1112px;margin:14px auto;background:#fff3d9;padding:10px 24px;color:#815d26}@media(max-width:750px){.hero{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:38px}.nav{gap:8px}header{gap:12px}}</style></head><body>
<header><span class="brand">慢集市</span><div class="search"><input id="q" placeholder="搜索商品" oninput="renderProducts()">⌕</div><div class="nav"><button onclick="page('home')">首页</button><button onclick="page('cart')">购物车 <b id="badge">0</b></button><button onclick="page('orders')">我的订单</button></div></header><p id="notice" class="notice" hidden></p>
<main><section id="home" class="view show"><div class="hero"><div><h1>慢慢挑，<br>安心买。</h1><p>商品、购物车、地址和订单均通过后端接口完成。本项目不再使用浏览器本地数据模拟。</p><button class="primary" onclick="document.getElementById('goods').scrollIntoView()">查看商品</button></div><img src="https://picsum.photos/id/433/900/560" alt="桌上静物"></div><div class="section-head"><h2 id="goods">商品精选</h2><select id="cat" onchange="renderProducts()"><option value="">全部分类</option><option>家居</option><option>文具</option><option>生活</option></select></div><div id="products" class="products"></div></section><section id="cart" class="view"><div class="panel"><h2>购物车</h2><div id="cartlist"></div><div class="total"><span>合计</span><b id="sum">¥0</b></div><button class="primary" onclick="checkout()">去结算</button></div></section><section id="orders" class="view"><div class="panel"><h2>收货地址</h2><div id="addresses"></div><form class="form" onsubmit="addAddress(event)"><input id="name" placeholder="收货人" required><input id="phone" placeholder="手机号" required><input id="detail" placeholder="详细地址" required><button class="primary">新增地址</button></form><h2>我的订单</h2><div id="orderlist"></div></div></section></main>
<script src="config.js"></script><script>
const API=window.MALL_API_ORIGIN||window.location.origin;let products=[],cart=[],addresses=[],orders=[];const el=id=>document.getElementById(id),money=n=>`¥${Number(n).toFixed(0)}`;
async function api(path,opt={}){const res=await fetch(`${API}/api${path}`,{...opt,headers:{'Content-Type':'application/json','x-demo-user':'1',...(opt.headers||{})}});if(res.status===204)return null;const data=await res.json();if(!res.ok)throw Error(data.message||'请求失败');return data}function problem(e){el('notice').hidden=false;el('notice').textContent=`后端连接提示：${e.message}。请先部署 server，再配置 MALL_API_ORIGIN。`}
async function load(){try{[products,cart,addresses,orders]=await Promise.all([api('/products'),api('/cart').then(x=>x.items),api('/addresses'),api('/orders')]);render()}catch(e){problem(e)}}function page(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('show'));el(id).classList.add('show');render()}
function renderProducts(){const key=el('q').value.toLowerCase(),c=el('cat').value;el('products').innerHTML=products.filter(x=>(!c||x.category===c)&&x.name.toLowerCase().includes(key)).map(x=>`<article class="product"><img src="${x.image}" alt="${x.name}"><h3>${x.name}</h3><small>${x.category} · 库存 ${x.stock}</small><p class="price">${money(x.price)}<button onclick="add(${x.id})">加入</button></p></article>`).join('')||'<p class="empty">没有找到商品。</p>'}
function render(){renderProducts();el('badge').textContent=cart.reduce((s,x)=>s+x.quantity,0);el('cartlist').innerHTML=cart.length?cart.map(x=>`<div class="cart-row"><img src="${x.product.image}"><div><b>${x.product.name}</b><br>${money(x.product.price)} · 库存 ${x.product.stock}</div><input class="qty" type="number" min="1" max="${x.product.stock}" value="${x.quantity}" onchange="changeQty(${x.product.id},this.value)"><button class="remove" onclick="removeCart(${x.product.id})">删除</button></div>`).join(''):'<p class="empty">购物车还是空的。</p>';el('sum').textContent=money(cart.reduce((s,x)=>s+x.product.price*x.quantity,0));el('addresses').innerHTML=addresses.map(a=>`<div class="addr"><input type="radio" name="addr" ${a.isDefault?'checked':''} onchange="makeDefault(${a.id})"><div>${a.name} ${a.phone}<br><small>${a.detail}</small></div><button class="remove" onclick="removeAddress(${a.id})">删除</button></div>`).join('')||'<p class="empty">请先添加一个收货地址。</p>';el('orderlist').innerHTML=orders.map(o=>`<article class="order"><b>${o.orderNo}</b> · ${o.status==='pending'?'待支付':'已取消'}<br><small>${o.items.map(x=>x.product.name+' × '+x.quantity).join('，')}</small><p>${money(o.total)} ${o.status==='pending'?`<button class="remove" onclick="cancel(${o.id})">取消订单</button>`:''}</p></article>`).join('')||'<p class="empty">还没有订单。</p>'}
async function add(id){try{await api('/cart',{method:'POST',body:JSON.stringify({productId:id})});await load()}catch(e){problem(e)}}async function changeQty(id,quantity){try{await api(`/cart/${id}`,{method:'PUT',body:JSON.stringify({quantity:+quantity})});await load()}catch(e){problem(e)}}async function removeCart(id){await api(`/cart/${id}`,{method:'DELETE'});await load()}async function addAddress(e){e.preventDefault();try{await api('/addresses',{method:'POST',body:JSON.stringify({name:el('name').value,phone:el('phone').value,detail:el('detail').value})});e.target.reset();await load()}catch(e){problem(e)}}async function makeDefault(id){await api(`/addresses/${id}/default`,{method:'PUT'});await load()}async function removeAddress(id){await api(`/addresses/${id}`,{method:'DELETE'});await load()}async function checkout(){try{await api('/orders',{method:'POST'});page('orders');await load()}catch(e){problem(e)}}async function cancel(id){try{await api(`/orders/${id}/cancel`,{method:'POST'});await load()}catch(e){problem(e)}}load();
</script></body></html>
